# Build and test the backend on every push to develop and every pull request
# (no base-branch filter, so stacked PRs whose base is a feature branch are covered)
name: Java CI

on:
  push:
    branches: [ "develop" ]
  pull_request:

defaults:
  run:
    working-directory: tabletopserv

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build, test and run functional E2E with Maven
      run: ./mvnw -B verify