# Install dependencies, build, lint and test the frontend
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

defaults:
  run:
    working-directory: tabletopweb

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # Standardized on Node 24 (engines + .nvmrc); Node 22 is covered by the
        # >=22.12 Vite peer range but CI only needs to run the pinned version.

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: tabletopweb/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    - run: npm test