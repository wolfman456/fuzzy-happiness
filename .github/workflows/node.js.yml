# Install dependencies, build, lint, unit-test and E2E-test the frontend
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "develop" ]
  # No branch filter: run on every PR (including stacked PRs whose base is a
  # feature branch) so the frontend is always built, linted and tested.
  pull_request:

defaults:
  run:
    working-directory: tabletopweb

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # Standardized on Node 24 (engines + .nvmrc); Node 22 is covered by the
        # >=22.12 Vite peer range but CI only needs to run the pinned version.

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: tabletopweb/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm run check:release-notes
    - run: npm run build
    - run: npm test

  e2e:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: tabletopweb/package-lock.json
    - run: npm ci
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - run: npm run test:e2e
    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: tabletopweb/playwright-report/
        retention-days: 7