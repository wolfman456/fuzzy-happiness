spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
tabletopserv.jwt.secret=${JWT_SECRET:}
tabletopserv.pii.secret=${PII_SECRET:}
tabletopserv.app.frontend-url=${FRONTEND_URL:}
tabletopserv.admin.username=${ADMIN_USERNAME:}
tabletopserv.admin.email=${ADMIN_EMAIL:}
tabletopserv.admin.password=${ADMIN_PASSWORD:}
tabletopserv.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
tabletopserv.gateway.url=${GATEWAY_URL:}
tabletopserv.gateway.token=${GATEWAY_TOKEN:}

server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:tabletop}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Schema migrations (design-draft-v2.md §3). Flyway owns the prod schema; Hibernate only
# validates it. baseline-on-migrate lets an already-populated database adopt Flyway at V1
# without re-running the baseline (V1__baseline.sql) that created existing tables.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline