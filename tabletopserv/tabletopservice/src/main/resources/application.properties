spring.application.name=tabletopserv
spring.profiles.default=dev
spring.docker.compose.enabled=false
# Flyway owns the prod schema only (application-prod.properties); dev/functional keep the
# Hibernate-managed H2 schema, and the baseline script is PostgreSQL-specific.
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

tabletopserv.app.base-url=${APP_BASE_URL:http://localhost:8080}
tabletopserv.app.frontend-url=${FRONTEND_URL:http://localhost:5173}
tabletopserv.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
tabletopserv.jwt.secret=${JWT_SECRET:JtCeUaD41EV9iI+WoPojPt0Llx3L46tk4lSra9ttjo5a88nzHJMNLZZELKkN3Qgc}
tabletopserv.pii.secret=${PII_SECRET:tabletop-dev-pii-secret-1122334455667788}
tabletopserv.jwt.expiration-millis=${JWT_EXPIRATION:86400000}
tabletopserv.verification.token-ttl-millis=${VERIFY_TTL:86400000}
tabletopserv.verification.resend-cooldown-millis=${RESEND_COOLDOWN:60000}
tabletopserv.admin.username=${ADMIN_USERNAME:admin}
tabletopserv.admin.email=${ADMIN_EMAIL:admin@tabletop.local}
tabletopserv.admin.password=${ADMIN_PASSWORD:AdminPassw0rd!}
tabletopserv.gateway.url=${GATEWAY_URL:http://localhost:3001}
tabletopserv.gateway.token=${GATEWAY_TOKEN:dev-gateway-token}
tabletopserv.gateway.connect-timeout-millis=${GATEWAY_CONNECT_TIMEOUT_MS:2000}
tabletopserv.gateway.response-timeout-millis=${GATEWAY_RESPONSE_TIMEOUT_MS:10000}
# Social OAuth login (R19, design-draft-v2.md §11) is opt-in and disabled by default: the provider
# buttons and the /oauth2 endpoints only appear when a registration's client-id is set. Spring Boot
# supplies provider defaults (authorize/token/user-info URIs) for the known ids, so activation needs
# only a client id + secret per provider, e.g.:
#   spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
#   spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
#   spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
#   spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
# Leave them commented/absent to keep the app password-only — an empty client-id would create a
# broken registration, so do not add them without real credentials.